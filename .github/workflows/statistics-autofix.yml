name: Statistics Autofix

on:
  push:
    branches: [feat/statistics-dashboard]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: true
      - name: Defer effect-owned resource loads
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('gui/src/pages/Statistics.tsx')
          text = path.read_text()
          old_price = '    void load().catch(() => setError(t("usage.loadError")));'
          new_price = '    queueMicrotask(() => { void load().catch(() => setError(t("usage.loadError"))); });'
          old_main = '  useEffect(() => { void load(); }, [load]);'
          new_main = '  useEffect(() => { queueMicrotask(() => { void load(); }); }, [load]);'
          if old_price not in text or old_main not in text:
              raise SystemExit('expected Statistics effect lines were not found')
          path.write_text(text.replace(old_price, new_price).replace(old_main, new_main))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add gui/src/pages/Statistics.tsx
          git commit -m "fix(statistics): defer effect-owned loads"
          git push
