name: Statistics feature validation

on:
  push:
    branches:
      - test/statistics-dashboard-ci

permissions:
  contents: read

concurrency:
  group: statistics-feature-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          cd gui
          bun install --frozen-lockfile
          cd ../docs-site
          bun install --frozen-lockfile

      - name: Focused backend statistics test
        run: bun test --isolate tests/statistics.test.ts

      - name: Typecheck
        run: bun run typecheck

      - name: Privacy scan
        run: bun run privacy:scan

      - name: GUI tests
        run: cd gui && bun test --isolate tests

      - name: GUI lint
        run: cd gui && bun run lint

      - name: GUI i18n lint
        run: cd gui && bun run lint:i18n

      - name: GUI build
        run: cd gui && bun run build

      - name: Documentation build
        run: cd docs-site && bun run build

  backend-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          cd gui
          bun install --frozen-lockfile

      - name: Build GUI for server tests
        run: cd gui && bun run build

      - name: Full backend test suite
        run: bun test --isolate --timeout 60000 tests
